<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1a1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>gSpot Golf</title>
<style>
:root{--bg:#0f1a1c;--card:#182629;--card2:#213236;--line:#2c4046;--fg:#f2f4f1;--mute:#93a5a8;--acc:#e8a33d;--good:#4cc38a;--bad:#e2604f;--blue:#4aa3df}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;letter-spacing:.3px}
header .idx{font-size:13px;color:var(--mute)} header .idx b{color:var(--acc);font-size:16px}
main{padding:12px 12px 24px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--acc)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
.big{font-size:56px;font-weight:700;line-height:1;color:var(--acc)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.mute{color:var(--mute)} .sm{font-size:13px} .xs{font-size:11px}
.good{color:var(--good)} .bad{color:var(--bad)} .acc{color:var(--acc)}
label.f{display:block;margin-bottom:10px;font-size:13px;color:var(--mute)}
input,select,textarea{width:100%;margin-top:4px;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
input[type=number]{-moz-appearance:textfield}
button.btn{width:100%;background:var(--acc);color:#1a1200;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:16px;margin-top:6px}
button.btn.sec{background:var(--card2);color:var(--fg)} button.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.btn:disabled{opacity:.4}
.btn.small{width:auto;padding:8px 14px;font-size:14px;margin:0}
/* scorecard */
.hole{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hole .top{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.hole .num{font-size:22px;font-weight:700;width:34px}
.hole .meta{color:var(--mute);font-size:13px;flex:1}
.hole .meta b{color:var(--fg)}
.hole .pts{font-size:13px;color:var(--mute)} .hole .pts b{font-size:18px;color:var(--fg)}
.hole .ctl{display:flex;align-items:center;gap:6px}
.step{display:flex;align-items:center;gap:2px}
.step button{width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);color:var(--fg);font-size:22px;font-weight:600;line-height:1}
.step .v{width:44px;text-align:center;font-size:24px;font-weight:700;background:none;border:0;color:var(--fg);padding:0}
.step .v.empty{color:var(--line)}
.step .v.par{color:var(--fg)} .step .v.under{color:var(--good)} .step .v.over{color:var(--bad)}
.stepwrap .lbl{font-size:10px;color:var(--mute);text-transform:uppercase;text-align:center;width:100%}
.stepwrap{display:flex;flex-direction:column;align-items:center}
.tog{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);font:inherit;font-size:13px;font-weight:600}
.tog.on{background:var(--good);border-color:var(--good);color:#04160c}
.tog.off{background:var(--bad);border-color:var(--bad);color:#fff}
.tog.hidden{visibility:hidden}
.cap{font-size:11px;color:var(--acc)}
.totals{background:var(--card2);border-radius:12px;padding:10px 12px;margin:10px 0 14px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:4px;text-align:center;font-size:14px}
.totals .h{font-size:10px;color:var(--mute);text-transform:uppercase}
.totals b{font-size:18px} .totals .l{text-align:left;font-weight:700}
.totals.round{background:linear-gradient(135deg,#243c33,#1a2a2d);border:1px solid var(--good)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:11px;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
.tbl{overflow-x:auto}
tr.counted td{color:var(--acc);font-weight:600}
.list a{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.list a:last-child{border:0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px} .stat span{font-size:11px;color:var(--mute);text-transform:uppercase}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bar i{display:block;height:10px;border-radius:5px;background:var(--blue)}
.bar em{width:64px;font-style:normal;color:var(--mute)}
svg.trend{width:100%;height:120px;display:block}
.holes-edit{display:grid;grid-template-columns:32px 1fr 1fr 1fr;gap:4px 6px;align-items:center;font-size:13px}
.holes-edit input{margin:0;padding:6px 4px;text-align:center}
.tees-edit{display:grid;grid-template-columns:1.2fr 1fr 1fr 32px;gap:4px 6px;align-items:center}
.tees-edit input{margin:0;padding:6px}
.msg{padding:10px;border-radius:10px;background:var(--card2);color:var(--mute);font-size:13px;margin:8px 0}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--card2);font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><h1 id="title">Play</h1><div class="idx" id="hdrIdx"></div></header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="play"><span>⛳️</span>Play</button>
  <button data-tab="rounds"><span>📋</span>Rounds</button>
  <button data-tab="handicap"><span>🎯</span>Handicap</button>
  <button data-tab="stats"><span>📈</span>Stats</button>
  <button data-tab="courses"><span>🏌️</span>Courses</button>
</nav>
<script src="handicap.js"></script>
<script src="courses.js"></script>
<script src="app.js"></script>
</body>
</html>
